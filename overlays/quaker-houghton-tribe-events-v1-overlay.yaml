      installation even though the vendor wrote the description document.
    x-api-evangelist-harvest:
      url: https://home.quakerhoughton.com/wp-json/tribe/events/v1/doc
      status: 200
      fetched: '2026-09-17'
    x-api-evangelist-surface-note: >-
      A CMS plugin surface, not a product API. The calendar served was EMPTY when probed
      (GET /events answered HTTP 200 with total 0, total_pages 0). Quaker Houghton's real digital
      products (QH Fluid Intelligence, FluidTrend, Insight Web) expose no public API.
    x-api-evangelist-operation-ids: >-
      The served document declares NO operationId on any of its 30 operations. Consumers that need
      stable identifiers should key on method + path; the sibling tec/v1 document does carry
      operationIds (getEvents, getEvent, createEvent, ...).
- target: $.info
  update:
    x-api-evangelist-authentication: >-
      No securitySchemes are declared. Reads are anonymous (verified live). POST and DELETE are
      enforced by WordPress capability checks and need HTTP Basic with an Application Password —
      credentials Quaker Houghton does not issue publicly. See ../authentication/quaker-houghton-authentication.yml.
- target: $.paths['/events'].get
  update:
    x-api-evangelist-pagination: >-
      page / per_page query parameters; the body carries events[], total, total_pages and rest_url,
      and the response exposes X-WP-Total, X-WP-TotalPages and an RFC 5988 Link header. The default
      window is today through two years ahead (observed in rest_url start_date / end_date).
    x-api-evangelist-live-probe:
      url: https://home.quakerhoughton.com/wp-json/tribe/events/v1/events?per_page=2
      status: 200
      total: 0
      fetched: '2026-09-17'
- target: $.paths['/events/{id}'].delete
  update:
    x-api-evangelist-reversibility: >-
      DELETE trashes the event; a second DELETE answers 410 Gone. No untrash/restore operation is
      exposed and no trash retention window is stated — grade none. See
      ../conventions/quaker-houghton-conventions.yml#reversibility.
