description: >-
  Cross-cutting runtime semantics of the REST and MCP surfaces on home.quakerhoughton.com — the
  WordPress REST conventions the Events Calendar plugin inherits (page/per_page pagination with
  X-WP-Total headers, the {code, message, data.status} error envelope, HTTP Basic on writes) and
  the OAuth 2.1 + PKCE posture of the MCP server. There is no idempotency mechanism, no request-id
  header, no field expansion and no rate-limit signalling.

