description: >-
  Quaker Houghton serves a remote Model Context Protocol server on its corporate WordPress host.
  It is not announced anywhere — no MCP registry entry, no documentation page, no llms.txt — and
  was found by probing /.well-known/* on home.quakerhoughton.com, which returns both RFC 8414
  authorization-server metadata and RFC 9728 protected-resource metadata naming the endpoint. The
  implementation is the WordPress MCP Adapter plugin (REST namespace `mcp`, alongside the
  `wp-abilities/v1` Abilities API), so the server fronts the website's content estate — posts,
  pages, media — not the QH Fluid Intelligence platform or any fluid-management product.
server:
