  protocol: MCP over HTTP (JSON-RPC 2.0)
  implementation: >-
    WordPress MCP Adapter — REST routes /wp-json/mcp/mcp-oauth-server (OAuth-gated) and
    /wp-json/mcp/mcp-adapter-default-server (WordPress-session gated), each accepting POST, GET and
    DELETE. Backed by the wp-abilities/v1 Abilities API, which also answers 401 anonymously.
  secondary_endpoints:
