description: >-
  Crosswalk between Quaker Houghton's agent-facing MCP surface and its machine-readable REST
  surface. Both live on the same WordPress host. The MCP server's tool list is OAuth-gated and
  the provider publishes no inventory, so no tool can be bound to an operation without
  fabricating one; the crosswalk is therefore empty and every published REST operation is
  recorded as rest_only. The one honest inference — that a WordPress MCP Adapter server built on
  the Abilities API is likely to expose site content rather than the Events Calendar
  endpoints — is recorded as a note, not as a binding.
