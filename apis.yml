description: >-
  Quaker Houghton (NYSE: KWR) is a global industrial process fluids company headquartered in
  Conshohocken, Pennsylvania, formed by the 2019 combination of Quaker Chemical and Houghton
  International. It makes metalworking, metal rolling, casting, forging and hydraulic fluids
  for the steel, aluminum, automotive, aerospace and machinery industries, and sells fluid
  management services under the QH Fluid Intelligence brand. It publishes no public API,
  developer portal or machine-readable contract.
