  reason: null
  detail: >-
    Quaker Houghton sells industrial process fluids and publishes no product API, developer portal
    or SDK (api./developer.quakerhoughton.com are wildcard DNS with a mismatched certificate, the
    npm/PyPI/GitHub searches are empty), but its corporate WordPress host does serve real machine
    surfaces: two Events Calendar OpenAPI documents (tribe/events/v1 stable and anonymously
    readable, tec/v1 experimental and gated by an acknowledgement header) and an OAuth 2.1 gated
    MCP server discovered through the RFC 8414 / RFC 9728 documents under /.well-known/ — all of
    which were harvested verbatim; the calendar itself held zero events when probed.
  evidence:
    - url: https://home.quakerhoughton.com/wp-json/tribe/events/v1/doc
      status: 200
    - url: https://home.quakerhoughton.com/wp-json/tec/v1/docs
