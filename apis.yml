  - aid: quaker-houghton:quaker-houghton-mcp-server
    name: Quaker Houghton MCP Server
    tags:
      - MCP
      - Content Management
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    baseURL: https://home.quakerhoughton.com/wp-json/mcp/mcp-oauth-server
    humanURL: https://home.quakerhoughton.com/
    description: >-
      A remote Model Context Protocol server served from home.quakerhoughton.com by the WordPress
      MCP Adapter plugin, discovered through the RFC 8414 and RFC 9728 documents the host publishes
      under /.well-known/. It is OAuth 2.1 gated (authorization-code + PKCE, single scope `mcp`,
      public clients via client-ID metadata documents); anonymous tools/list returns 401
      mcp_unauthorized, so the tool inventory is unknown. It fronts the corporate website's
      content estate, not any fluid-management product.
    properties:
      - url: mcp/quaker-houghton-mcp.yml
        type: MCPServer
      - url: mcp/quaker-houghton-tool-crosswalk.yml
        type: ToolCrosswalk
      - url: scopes/quaker-houghton-scopes.yml
        type: OAuthScopes
    x-surface: platform-generated
    x-platform: wordpress
    x-platform-surface: mcp-plugin
